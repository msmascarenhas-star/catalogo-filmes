<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Filmes</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="app">
    <header class="topo">
      <a href="./" id="logo" class="logo">🎬 Filmes</a>
      <input id="busca" type="search" placeholder="Buscar filme..." aria-label="Buscar filme" autocomplete="off">
      <button id="btn-lista" type="button" class="btn">Quero assistir (0)</button>
    </header>

    <section id="area-filtros">
      <button id="btn-filtros" type="button" class="btn btn-filtros" aria-expanded="false">Filtros</button>
      <div id="painel-filtros" class="painel-filtros">
        <fieldset>
          <legend>Streaming</legend>
          <div id="filtro-streamings" class="streamings"></div>
        </fieldset>
        <label>Gênero
          <select id="filtro-genero"><option value="">Todos</option></select>
        </label>
        <label>Ordenar por
          <select id="filtro-ordem">
            <option value="popularidade">Popularidade</option>
            <option value="nota">Nota</option>
            <option value="recentes">Lançamento recente</option>
          </select>
        </label>
      </div>
    </section>

    <main>
      <h1 id="titulo-tela" class="titulo-tela"></h1>
      <div id="mensagem" class="mensagem" hidden></div>
      <div id="grade" class="grade"></div>
      <button id="carregar-mais" type="button" class="btn carregar-mais" hidden>Carregar mais</button>
    </main>

    <footer class="rodape">Dados de filmes e disponibilidade: TMDB e JustWatch. Este site não é endossado pelo TMDB.</footer>
  </div>

  <dialog id="detalhes" class="detalhes" aria-label="Detalhes do filme">
    <button id="fechar-detalhes" type="button" class="fechar" aria-label="Fechar">✕</button>
    <div id="conteudo-detalhes"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="tmdb.js"></script>
  <script src="lista.js"></script>
  <script src="estado.js"></script>
  <script src="app.js"></script>
</body>
</html>
